<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Serif";src:url(is-italic.woff2) format("woff2");font-style:italic;font-weight:400}
@font-face{font-family:"Serif";src:url(is-regular.woff2) format("woff2");font-style:normal;font-weight:400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden}
body{font-family:"Inter Display","Inter",sans-serif;-webkit-font-smoothing:antialiased;position:relative}
body.sq{width:1080px;height:1080px}
body.st{width:1080px;height:1920px}

/* themes */
.ink{--bg:#0B0B0C;--fg:#F4F1EB;--mut:rgba(244,241,235,.52);--q:#1D1D20;--qfg:#F4F1EB;--btn:#2D4BFF;--btnfg:#fff;--ghost:rgba(244,241,235,.05);--acc:#6F86FF}
.bone{--bg:#EEEAE3;--fg:#0B0B0C;--mut:rgba(11,11,12,.5);--q:#FFFFFF;--qfg:#0B0B0C;--btn:#0B0B0C;--btnfg:#F4F1EB;--ghost:rgba(11,11,12,.06);--acc:#2D4BFF}
.cob{--bg:#2D4BFF;--fg:#FFFFFF;--mut:rgba(255,255,255,.7);--q:rgba(255,255,255,.16);--qfg:#fff;--btn:#FFFFFF;--btnfg:#0B0B0C;--ghost:rgba(255,255,255,.08);--acc:#fff}
body{background:var(--bg);color:var(--fg)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(ellipse 80% 60% at 70% 20%,rgba(255,255,255,.06),transparent 60%)}
.bone .grain{background:radial-gradient(ellipse 80% 60% at 70% 15%,rgba(255,255,255,.7),transparent 60%)}
.cob .grain{background:radial-gradient(ellipse 90% 70% at 80% 10%,rgba(255,255,255,.18),transparent 60%)}

.stage{position:absolute;inset:0;display:flex;flex-direction:column}
.sq .stage{padding:76px 84px 80px}
.st .stage{padding:300px 84px 690px}
.top{display:flex;justify-content:space-between;align-items:center;flex:none}
.logo{height:34px;display:block}
.st .logo{height:44px}
.dom{font-size:20px;font-weight:500;color:var(--mut);letter-spacing:-.005em}
.st .dom{font-size:24px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

h1{font-weight:700;letter-spacing:-.05em;line-height:.96}
.sq h1{font-size:122px}
.st h1{font-size:136px}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
h1 .ln>span{display:inline-block}
h1 i,.ser{font-family:"Serif";font-style:italic;font-weight:400;letter-spacing:-.025em;font-size:1.1em;line-height:.8}
h1 i{color:var(--acc)}
.sub{color:var(--mut);font-weight:500;letter-spacing:-.02em;line-height:1.2}
.sq .sub{font-size:38px;margin-top:34px}
.st .sub{font-size:44px;margin-top:48px}
.sub b{color:var(--fg);font-weight:600}

/* bubbles */
.bub{display:inline-flex;align-items:center;gap:14px;background:var(--q);color:var(--qfg);font-weight:500;letter-spacing:-.015em;border-radius:40px 40px 40px 10px;align-self:flex-start;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.sq .bub{font-size:32px;padding:22px 32px;margin-bottom:46px}
.st .bub{font-size:38px;padding:28px 40px;margin-bottom:64px}
.bub.ans{gap:0;background:#fff;color:#0B0B0C;border-radius:40px 40px 10px 40px;align-self:flex-end}
.bub .dot{width:14px;height:14px;border-radius:50%;background:#2D4BFF;flex:none}
.caret{display:inline-block;width:3px;height:1em;background:currentColor;vertical-align:-.14em;margin-left:3px}

/* cta */
.foot{flex:none;display:flex;align-items:center;justify-content:space-between}
.st .foot{flex-direction:column;align-items:stretch;gap:26px}
.btn{display:inline-flex;align-items:center;gap:20px;background:var(--btn);color:var(--btnfg);font-weight:600;letter-spacing:-.02em;border-radius:999px;white-space:nowrap;position:relative;overflow:hidden}
.sq .btn{font-size:32px;height:92px;padding:0 14px 0 40px}
.st .btn{font-size:40px;height:122px;padding:0 18px 0 52px;justify-content:space-between}
.btn .ar{border-radius:50%;background:var(--btnfg);display:grid;place-items:center;flex:none}
.sq .btn .ar{width:64px;height:64px}
.st .btn .ar{width:88px;height:88px}
.btn .ar svg{stroke:var(--btn)}
.free{color:var(--mut);font-weight:500;letter-spacing:-.01em}
.sq .free{font-size:24px;text-align:right;line-height:1.3}
.st .free{font-size:28px;text-align:center}

.big1{position:absolute;font-weight:800;letter-spacing:-.08em;line-height:.8;color:transparent;-webkit-text-stroke:3px rgba(11,11,12,.10);pointer-events:none}
.sq .big1{font-size:820px;right:10px;bottom:-60px}
.st .big1{font-size:1150px;right:-10px;bottom:200px}
.blurw{display:inline-block}
.fine{position:absolute;font-size:15px;color:var(--mut);opacity:.6}
.sq .fine{left:84px;bottom:34px}
.st .fine{left:0;right:0;text-align:center;bottom:290px;font-size:18px}
</style></head>
<body>

<div class="stage" id="stage"></div>
<script>
const P=new URLSearchParams(location.search);
const C=P.get('c')||'a', F=P.get('f')||'sq', ST=F==='st';
const ARROW='<svg width="46%" height="46%" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function H(lines,start,step=.12){return `<h1>${lines.map((l,i)=>`<span class="ln"><span data-a="mask ${(start+i*step).toFixed(2)} .8">${l}</span></span>`).join('')}</h1>`}
function hdr(theme){return `<div class="top" data-a="fade 0 .6"><img class="logo" src="${theme==='bone'?'logo_dark.png':'logo.png'}"><span class="dom">therankcollective.com</span></div>`}
function foot(s,label='Get your free AI audit'){return `<div class="foot" data-a="up ${s} .7"><div class="btn">${label}<span class="ar">${ARROW}</span></div><div class="free">${ST?'Free. Takes one click.':'Free.<br>Takes one click.'}</div></div>`}

const CON={
 a:{theme:'ink',html:()=>`${hdr('ink')}<div class="mid">
   <div class="bub" data-a="pop .2 .5"><span class="dot"></span><span data-type=".5 1.0">Who's the best dentist near me?</span></div>
   ${H(['ChatGPT just','recommended','<i>your competitor.</i>'],1.7,.14)}
  </div>${foot(3.4)}`},
 b:{theme:'bone',html:()=>`${hdr('bone')}<div class="mid">
   ${H(['Your customers','stopped <i>Googling.</i>'],.2,.16)}
   <div class="sub" data-a="up 1.5 .7">They ask AI now.<br><b>Is it naming you?</b></div>
  </div>${foot(2.6)}`},
 c:{theme:'cob',html:()=>`${hdr('cob')}<div class="mid">
   <div class="bub" data-a="pop .2 .5"><span data-type=".4 .9">Who's the best roofer in town?</span></div>
   <div class="bub ans" data-a="pop 1.6 .5"><span>I'd go with <b>your business.</b></span></div>
   ${H(['Be the <i>answer.</i>'],2.5)}
   <div class="sub" data-a="up 3.1 .7">Get named when people ask AI.</div>
  </div>${foot(3.8,'Get your free AI audit')}`},
 d:{theme:'ink',html:()=>`${hdr('ink')}<div class="mid">
   ${H(['<span class="blurw" id="bw">Invisible</span>','to <i>AI?</i>'],.2,.16)}
   <div class="sub" data-a="up 2.4 .7">If AI can't read your site,<br><b>it won't recommend you.</b></div>
  </div>${foot(3.2,'Check my site free')}`},
 e:{theme:'bone',html:()=>`${hdr('bone')}<div class="mid">
   ${H(["There's no","page 2","<i>in AI.</i>"],.2,.14)}
   <div class="sub" data-a="up 1.7 .7">AI gives one answer.<br><b>Make sure it's you.</b></div>
  </div>${foot(2.6)}`},
 f:{theme:'ink',html:()=>`${hdr('ink')}<div class="mid">
   ${H(['Ask ChatGPT',"who's the best","in your city."],.2,.14)}
   <div class="sub ser" data-a="up 1.8 .8" style="color:var(--acc);font-size:${ST?84:76}px;line-height:1;margin-top:${ST?44:30}px">Not you? We fix that.</div>
  </div>${foot(2.8)}`},
};
const def=CON[C];
document.body.className=F+' '+def.theme;
document.getElementById('stage').innerHTML=def.html();
window.DUR=8; window.STATIC_T=7.5;

const cl=x=>Math.min(1,Math.max(0,x)), eo=p=>1-Math.pow(1-p,4), ex=p=>p>=1?1:1-Math.pow(2,-10*p);
const back=p=>{const a=1.4,b=a+1;return 1+b*Math.pow(p-1,3)+a*Math.pow(p-1,2)};
const pr=(t,s,d)=>cl((t-s)/d);
const els=[...document.querySelectorAll('[data-a]')].map(el=>{const [type,s,d]=el.dataset.a.split(' ');return {el,type,s:+s,d:+d}});
const typed=[...document.querySelectorAll('[data-type]')].map(el=>{const [s,d]=el.dataset.type.split(' ').map(Number);return {el,s,d,txt:el.textContent}});
function render(t){
  for(const o of els){
    const p=pr(t,o.s,o.d); let op=1,tf='',bl=0;
    if(o.type==='mask'){const e=ex(p); tf=`translateY(${(1-e)*105}%)`;}
    else if(o.type==='up'){const e=eo(p); op=e; tf=`translateY(${(1-e)*40}px)`; bl=(1-e)*8;}
    else if(o.type==='pop'){op=cl(p*2.5); tf=`scale(${.8+.2*back(p)})`; o.el.style.transformOrigin=o.el.classList.contains('ans')?'100% 100%':'0 100%';}
    else if(o.type==='fade'){op=eo(p);}
    o.el.style.opacity=op; o.el.style.transform=tf; o.el.style.filter=bl>.05?`blur(${bl}px)`:'none';
  }
  for(const o of typed){
    const p=pr(t,o.s,o.d), n=Math.round(o.txt.length*p);
    const car=p<1&&t>=o.s;
    o.el.innerHTML=o.txt.slice(0,n)+(car?'<span class="caret"></span>':'')+`<span style="opacity:0">${o.txt.slice(n)}</span>`;
  }
  const bw=document.getElementById('bw');
  if(bw){const p=eo(pr(t,1.2,1.4)); bw.style.filter=`blur(${p*7}px)`; bw.style.opacity=1-p*.55;}
  const b1=document.querySelector('.big1'); if(b1){b1.style.transform=`translateY(${(1-eo(pr(t,.1,2)))*80 - t*4}px)`}
  
}
window.render=render; render(0);
</script>
</body></html>
